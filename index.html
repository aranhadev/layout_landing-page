<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>THE MET</title>
    <link rel="icon" type="image/png"
    href="src/images/img_logo.png" />
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <link
      rel="stylesheet"
      href="src/styles/menu.scss"

    <link
      rel="stylesheet"
      href="src/styles/home.scss"
    />
    <script

    ></script>

      <div id="menu" class="menu">

        </div>
        <nav class="menu__nav">
          <a href="#home" class="menu__link">Home</a>
